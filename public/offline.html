<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline – AI Teacher</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, sans-serif;
        background: #FAFAF8;
        color: #1C2230;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 8px;
      }
      p {
        color: #4b5563;
        line-height: 1.5;
      }
      button {
        margin-top: 16px;
        background: #1E3A5F;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>
        No internet connection right now. Any lessons or quizzes you already
        opened are still available. New AI Teacher requests need a
        connection.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
